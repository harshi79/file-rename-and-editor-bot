# Optional Render config (Dockerfile is the preferred free path).
# Set BOT_TOKEN in the dashboard.
services:
  - type: web
    name: file-rename-and-editor-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
